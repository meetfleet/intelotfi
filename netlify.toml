# Static site: nothing to build, publish the repo root as-is.
# Fast deploys mean pushes no longer pile up and skip each other.
[build]
  publish = "."
  command = ""

# Pages are always re-checked, so a new deploy shows up on the next visit.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS/JS are linked with ?v=… so they can be cached; media rarely changes.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Breachify chapters moved to keyword URLs; old links pass their ranking on (301).
[[redirects]]
  from = "/blog/outside-in.html"
  to = "/blog/breachify-outside-in.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/outside-in"
  to = "/blog/breachify-outside-in.html"
  status = 301
  force = true

