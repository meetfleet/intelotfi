# Static site: nothing to build, publish the repo root as-is.
# Fast deploys mean pushes no longer pile up and skip each other.
[build]
  publish = "."
  command = ""

# Pages are always re-checked, so a new deploy shows up on the next visit.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS/JS are linked with ?v=… so they can be cached; media rarely changes.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# NOTE: intelotfi.com is served by GitHub Pages (CNAME + .nojekyll), which ignores
# this file. These rules only apply if the repo is deployed on Netlify. On the
# live site the same forwarding is done by small HTML redirect pages in blog/
# (outside-in.html, beyond-the-password.html, machinery.html).
#
# Breachify lives at /breach-intelligence/ (linked from the site). The original
# pages also stay at /breachify/ and /blog/breachify-*.html for old links and
# search, unlinked from the site.
[[redirects]]
  from = "/blog/outside-in.html"
  to = "/blog/breachify-outside-in.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/outside-in"
  to = "/blog/breachify-outside-in.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/beyond-the-password.html"
  to = "/blog/breachify-beyond-password.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/beyond-the-password"
  to = "/blog/breachify-beyond-password.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/machinery.html"
  to = "/blog/breachify-machinery.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/machinery"
  to = "/blog/breachify-machinery.html"
  status = 301
  force = true

[[redirects]]
  from = "/assets/breachify/*"
  to = "/assets/breach-intelligence/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/assets/og-breachify-1.jpg"
  to = "/assets/og-breach-intelligence-1.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/assets/og-breachify-2.jpg"
  to = "/assets/og-breach-intelligence-2.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/assets/og-breachify-3.jpg"
  to = "/assets/og-breach-intelligence-3.jpg"
  status = 301
  force = true
